<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かおかくしカメラ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7ff;--sf:#fff;--tx:#2a2340;--mu:#7a7396;--ac:#7c5cff;--ac2:#ff6fa5;--bd:#e4dff5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142a;--sf:#241f3d;--tx:#f1edff;--mu:#a59fc7;--bd:#3a3360}}
:root[data-theme="dark"]{--bg:#17142a;--sf:#241f3d;--tx:#f1edff;--mu:#a59fc7;--bd:#3a3360}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:44px;min-width:44px}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:700}
button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.row{display:flex;gap:6px;overflow-x:auto;align-items:center;padding:6px 10px;scrollbar-width:none}
.row>*{flex:none}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
canvas{touch-action:none;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
#empty{text-align:center;color:var(--mu);line-height:1.9;padding:20px}
#empty b{display:block;font-size:44px}
#bar,#sheet{background:var(--sf);border-top:1px solid var(--bd);padding:6px 12px;display:none;align-items:center;gap:10px}
#sheet{flex-direction:column;align-items:stretch;gap:2px}
label.s{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
label.s span{min-width:64px}label.s input{flex:1;min-width:0}
#tray{background:var(--sf);border-top:1px solid var(--bd)}
.em{font-size:26px;padding:2px 8px}
#msg{font-size:12px;color:var(--mu);padding:0 12px;min-height:16px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:9}
#modal img{max-width:100%;max-height:70%;-webkit-touch-callout:default;-webkit-user-select:auto}
#modal p{color:#fff;text-align:center;margin:0}
</style></head><body>
<div class="row" id="top">
<button id="open">📷</button>
<button data-r="0" class="on">元</button><button data-r="1">1:1</button><button data-r="0.8">4:5</button><button data-r="1.7778">16:9</button>
<button id="rot">↻</button><button id="adj">🎨</button>
<button class="p" id="save">保存</button></div>
<input id="file" type="file" accept="image/*" hidden>
<div id="stage"><div id="empty"><b>📷</b>タップして写真を選ぶ<br>🔒 端末の中だけで処理。送信されません</div><canvas id="cv" hidden></canvas></div>
<div id="msg"></div>
<div id="bar"><button id="del">🗑</button><label class="s" id="csw" style="flex:1"><span>粗さ</span><input type="range" id="cs" min="4" max="40"></label></div>
<div id="sheet">
<div class="row" style="padding:2px 0"><button data-p="0,0,0,0,0">なし</button><button data-p="0,10,0,0,1">モノクロ</button><button data-p="5,0,15,25,0">あたたか</button><button data-p="0,0,10,-25,0">ひんやり</button><button data-p="15,-15,10,8,0">ふんわり</button></div>
<label class="s"><span>明るさ</span><input type="range" data-a="b" min="-60" max="60" value="0"></label>
<label class="s"><span>コントラスト</span><input type="range" data-a="c" min="-60" max="60" value="0"></label>
<label class="s"><span>あざやか</span><input type="range" data-a="s" min="-80" max="80" value="0"></label>
<label class="s"><span>暖かさ</span><input type="range" data-a="w" min="-60" max="60" value="0"></label></div>
<div id="tray" class="row"></div>
<div id="modal"><p>画像を長押しして「写真に追加」で保存</p><img id="mimg" alt=""><button id="mclose">閉じる</button></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv');
const EM=['😊','🥰','😎','🐱','🐶','🐰','🐻','🌸','⭐','💖','🎀','❓'],PI=Math.PI;
let src,SW,SH,ratio=0,V={ks:1,cx:0,cy:0,rot:0},items=[],sel=-1,gm={on:0,n:24},adj={b:0,c:0,s:0,w:0,mono:0},last='😊';
const say=t=>$('#msg').textContent=t||'';
const A=()=>ratio||(Math.round(Math.abs(V.rot)/(PI/2))%2?SH/SW:SW/SH);
const T=()=>{const W=cv.width,H=cv.height,k=V.ks*W;return{W,H,k,c:Math.cos(V.rot),s:Math.sin(V.rot)}};
function toImg(p,t=T()){const dx=p.x-t.W/2,dy=p.y-t.H/2;return{x:(dx*t.c+dy*t.s)/t.k+V.cx,y:(-dx*t.s+dy*t.c)/t.k+V.cy}}
function toOut(x,y,t=T()){const ux=(x-V.cx)*t.k,uy=(y-V.cy)*t.k;return{x:t.W/2+ux*t.c-uy*t.s,y:t.H/2+ux*t.s+uy*t.c}}
function anchor(a,m){const t=T(),dx=m.x-t.W/2,dy=m.y-t.H/2;V.cx=a.x-(dx*t.c+dy*t.s)/t.k;V.cy=a.y-(-dx*t.s+dy*t.c)/t.k}
const cover=()=>Math.max(1/SW,(1/A())/SH);
function refit(){V.ks=cover();V.cx=SW/2;V.cy=SH/2}
const loc=(it,lx,ly)=>{const c=Math.cos(it.rot),s=Math.sin(it.rot);return{x:it.x+lx*c-ly*s,y:it.y+lx*s+ly*c}};
function pix(x,snap,W,H,cell){const tw=Math.max(1,Math.ceil(W/cell)),th=Math.max(1,Math.ceil(H/cell)),t=document.createElement('canvas');t.width=tw;t.height=th;
 t.getContext('2d').drawImage(snap,0,0,tw,th);x.imageSmoothingEnabled=false;x.drawImage(t,0,0,tw,th,0,0,tw*cell,th*cell);x.imageSmoothingEnabled=true}
function render(c,W,ui){
 const H=Math.round(W/A());c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true}),t=T();
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.imageSmoothingQuality='high';
 x.save();x.translate(W/2,H/2);x.rotate(V.rot);x.scale(t.k,t.k);x.translate(-V.cx,-V.cy);x.drawImage(src,0,0);x.restore();
 if(adj.b||adj.c||adj.s||adj.w||adj.mono){const d=x.getImageData(0,0,W,H),p=d.data,B=adj.b*2.55,C=(adj.c+100)/100,S=adj.mono?0:1+adj.s/100,Wm=adj.w*.6;
  for(let i=0;i<p.length;i+=4){let r=(p[i]+Wm-128)*C+128+B,g=(p[i+1]-128)*C+128+B,b=(p[i+2]-Wm-128)*C+128+B;const l=.3*r+.59*g+.11*b;
   p[i]=l+(r-l)*S;p[i+1]=l+(g-l)*S;p[i+2]=l+(b-l)*S}x.putImageData(d,0,0)}
 const hasM=gm.on||items.some(i=>i.k[0]==='m');let snap;
 if(hasM){snap=document.createElement('canvas');snap.width=W;snap.height=H;snap.getContext('2d').drawImage(c,0,0)}
 if(gm.on)pix(x,snap,W,H,Math.max(3,W/gm.n));
 items.forEach(it=>{x.save();x.translate(W/2,H/2);x.rotate(V.rot);x.scale(t.k,t.k);x.translate(-V.cx,-V.cy);x.translate(it.x,it.y);x.rotate(it.rot);
  if(it.k[0]==='m'){x.beginPath();if(it.k==='mc')x.ellipse(0,0,it.w/2,it.h/2,0,0,7);else x.rect(-it.w/2,-it.h/2,it.w,it.h);x.clip();x.setTransform(1,0,0,1,0,0);
   pix(x,snap,W,H,Math.max(3,Math.min(it.w,it.h)*t.k/it.n))}
  else{x.font=`${it.w}px "Apple Color Emoji","Noto Color Emoji",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(it.k,0,it.w*.08)}
  x.restore()});
 if(ui&&sel>=0){const it=items[sel],sc=W/cv.getBoundingClientRect().width,hw=it.w/2,hh=it.h/2;
  x.strokeStyle='#7c5cff';x.lineWidth=2.5*sc;x.setLineDash([8*sc,6*sc]);x.beginPath();
  [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].forEach(([a,b],i)=>{const o=toOut(...Object.values(loc(it,a,b)),t);i?x.lineTo(o.x,o.y):x.moveTo(o.x,o.y)});x.closePath();x.stroke();x.setLineDash([]);
  const h=toOut(...Object.values(loc(it,hw,hh)),t);x.fillStyle='#fff';x.beginPath();x.arc(h.x,h.y,13*sc,0,7);x.fill();x.stroke();
  x.fillStyle='#7c5cff';x.font=`${14*sc}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('⤡',h.x,h.y)}}
function draw(){if(!src)return;const b=$('#stage').getBoundingClientRect(),a=A(),w=Math.min(b.width-8,(b.height-8)*a),h=w/a;
 cv.style.width=w+'px';cv.style.height=h+'px';render(cv,Math.round(Math.min(1000,w*devicePixelRatio)),true)}
let raf=0;const redraw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)};
function ui(){const m=sel>=0&&items[sel].k[0]==='m',g=sel<0&&gm.on;$('#bar').style.display=sel>=0||g?'flex':'none';$('#del').style.display=sel>=0?'':'none';
 $('#csw').style.visibility=m||g?'visible':'hidden';$('#cs').value=44-(m?items[sel].n:gm.n);
 document.querySelectorAll('#tray [data-g]').forEach(b=>b.classList.toggle('on',!!gm.on));draw()}
// load
$('#open').onclick=$('#empty').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();
 im.onload=()=>{const k=Math.min(1,2000/Math.max(im.width,im.height));SW=Math.round(im.width*k);SH=Math.round(im.height*k);
  src=document.createElement('canvas');src.width=SW;src.height=SH;src.getContext('2d').drawImage(im,0,0,SW,SH);URL.revokeObjectURL(im.src);
  items=[];sel=-1;gm.on=0;V.rot=0;ratio=0;setR(0);$('#empty').hidden=true;cv.hidden=false;say('ドラッグで移動・2本指で拡大/回転。下のスタンプをタップで追加');cv.width=10;refit();ui()};im.src=URL.createObjectURL(f)};
function setR(r){ratio=r;document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',+b.dataset.r===r))}
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!src)return;setR(+b.dataset.r);refit();ui()});
$('#rot').onclick=()=>{if(!src)return;V.rot+=PI/2;refit();ui()};
$('#adj').onclick=()=>{const s=$('#sheet');s.style.display=s.style.display==='flex'?'none':'flex';$('#adj').classList.toggle('on',s.style.display==='flex');setTimeout(draw,0)};
document.querySelectorAll('[data-a]').forEach(i=>i.oninput=()=>{adj[i.dataset.a]=+i.value;redraw()});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const a=b.dataset.p.split(',').map(Number);adj={b:a[0],c:a[1],s:a[2],w:a[3],mono:a[4]};
 ['b','c','s','w'].forEach(k=>$(`[data-a=${k}]`).value=adj[k]);draw()});
// tray
const tray=$('#tray');
tray.innerHTML=`<button class="p" id="auto">✨自動</button><button data-k="mc">⚪<small>モザイク</small></button><button data-k="mr">▭<small>範囲</small></button><button data-g="1">🔳<small>全体</small></button>`+EM.map(e=>`<button class="em" data-k="${e}">${e}</button>`).join('');
function add(k){if(!src)return say('先に写真を選んでください');last=k;const t=T(),c=toImg({x:t.W/2,y:t.H/2},t),u=1/V.ks;
 const it={k,x:c.x,y:c.y,rot:0,w:u*.24,h:u*.24,n:12};if(k==='mr'){it.w=u*.4;it.h=u*.22}items.push(it);sel=items.length-1;ui()}
tray.onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='auto')return auto();
 if(b.dataset.g){if(!src)return say('先に写真を選んでください');gm.on=gm.on?0:1;sel=-1;return ui()}
 add(b.dataset.k)};
async function auto(){if(!src)return say('先に写真を選んでください');
 if(!('FaceDetector' in window))return say('この端末は自動検出に未対応。スタンプを追加して顔に合わせてください');
 try{const fs=await new FaceDetector({maxDetectedFaces:20}).detect(src);if(!fs.length)return say('顔が見つかりませんでした');
  fs.forEach(f=>{const b=f.boundingBox,s=Math.max(b.width,b.height)*1.15;items.push({k:last==='mr'?'mc':last,x:b.x+b.width/2,y:b.y+b.height/2,rot:0,w:s,h:s,n:12})});
  sel=items.length-1;say(fs.length+'人の顔に適用（最後に選んだスタンプ）');ui()}catch(e){say('自動検出に失敗しました')}}
$('#del').onclick=()=>{items.splice(sel,1);sel=-1;ui()};
$('#cs').oninput=e=>{const n=44-e.target.value;sel>=0?items[sel].n=n:gm.n=n;redraw()};
// gestures
const pts=new Map();let st=null;
const P=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
const sc=()=>cv.width/cv.getBoundingClientRect().width;
function local(it,q){const dx=q.x-it.x,dy=q.y-it.y,c=Math.cos(it.rot),s=Math.sin(it.rot);return{x:dx*c+dy*s,y:-dx*s+dy*c}}
function hit(p){const q=toImg(p),pad=14*sc()/T().k;
 for(let i=items.length-1;i>=0;i--){const it=items[i],l=local(it,q),hw=it.w/2+pad,hh=it.h/2+pad;
  if(it.k==='mc'?(l.x*l.x/(hw*hw)+l.y*l.y/(hh*hh)<=1):(Math.abs(l.x)<=hw&&Math.abs(l.y)<=hh))return i}return -1}
function hHit(p){const it=items[sel],o=toOut(...Object.values(loc(it,it.w/2,it.h/2)));return Math.hypot(o.x-p.x,o.y-p.y)<28*sc()}
function begin(p,keep){const q=toImg(p);
 if(sel>=0&&hHit(p))return st={m:'h'};
 const h=keep&&sel>=0?sel:hit(p);
 if(h>=0){const changed=sel!==h;sel=h;st={m:'mv',ox:items[h].x-q.x,oy:items[h].y-q.y};if(changed)ui();return}
 if(sel>=0){sel=-1;ui()}st={m:'pan',a:q}}
cv.onpointerdown=e=>{if(!src)return;cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,P(e));
 if(pts.size===1)begin(P(e));
 else if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,g=Math.atan2(b.y-a.y,b.x-a.x),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  if(sel>=0&&(st.m==='mv'||st.m==='h')){const it=items[sel];st={m:'pi',d,g,w:it.w,h:it.h,r:it.rot}}
  else st={m:'pz',d,g,k:V.ks,r:V.rot,a:toImg(mid)}}};
cv.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,P(e));if(!st)return;const p=P(e),it=items[sel];
 if(st.m==='mv'){const q=toImg(p);it.x=q.x+st.ox;it.y=q.y+st.oy}
 else if(st.m==='h'){const q=toImg(p),v={x:q.x-it.x,y:q.y-it.y};
  if(it.k[0]==='m'){const l=local(it,q);it.w=Math.max(12,Math.abs(l.x)*2);it.h=Math.max(12,Math.abs(l.y)*2)}
  else{it.w=it.h=Math.max(10,Math.hypot(v.x,v.y)*Math.SQRT2);it.rot=Math.atan2(v.y,v.x)-PI/4}}
 else if(st.m==='pan')anchor(st.a,p);
 else{const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,g=Math.atan2(b.y-a.y,b.x-a.x),f=d/st.d;
  if(st.m==='pi'){it.w=st.w*f;it.h=st.h*f;it.rot=st.r+g-st.g}
  else{V.ks=Math.min(cover()*12,Math.max(cover()*.3,st.k*f));let r=st.r+g-st.g;const n=Math.round(r/(PI/2))*(PI/2);if(Math.abs(r-n)<.05)r=n;V.rot=r;anchor(st.a,{x:(a.x+b.x)/2,y:(a.y+b.y)/2})}}
 redraw()};
const up=e=>{pts.delete(e.pointerId);if(pts.size===0)st=null;else if(pts.size===1&&st&&(st.m==='pi'||st.m==='pz'))begin([...pts.values()][0],st.m==='pi');draw()};
cv.onpointerup=cv.onpointercancel=up;
cv.addEventListener('wheel',e=>{e.preventDefault();const p=P(e),a=toImg(p);V.ks=Math.min(cover()*12,Math.max(cover()*.3,V.ks*Math.exp(-e.deltaY*.0015)));anchor(a,p);redraw()},{passive:false});
// save
$('#save').onclick=()=>{if(!src)return say('先に写真を選んでください');const o=document.createElement('canvas'),a=A();
 render(o,Math.round(a>=1?2048:2048*a),false);
 o.toBlob(async b=>{const f=new File([b],'photo.jpg',{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  $('#mimg').src=URL.createObjectURL(b);$('#modal').style.display='flex'},'image/jpeg',.92)};
$('#mclose').onclick=()=>$('#modal').style.display='none';
addEventListener('resize',draw);ui();
</script></body></html>
