<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かおかくしカメラ</title>
<style>
:root{--bg:#faf7ff;--sf:#fff;--tx:#2a2340;--mu:#6b6488;--ac:#7c5cff;--bd:#ddd6f3;--er:#c0305a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142a;--sf:#241f3d;--tx:#f1edff;--mu:#a59fc7;--bd:#3a3360;--er:#ff7d9f}}
:root[data-theme="dark"]{--bg:#17142a;--sf:#241f3d;--tx:#f1edff;--mu:#a59fc7;--bd:#3a3360;--er:#ff7d9f}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:6px 12px;font-weight:700}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:44px}
button:disabled{opacity:.4}button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
button.p{background:var(--ac);color:#fff;border:0;font-weight:700}
#stage{position:relative;flex:1;min-height:0;margin:0 8px}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#0002;border-radius:10px;user-select:none;-webkit-user-select:none}
#vp.off{visibility:hidden}
#layer{position:absolute;left:0;top:0;transform-origin:0 0;--iz:1}
#cv{display:block;width:100%;height:100%;pointer-events:none}
#frame{position:absolute;border:calc(3px*var(--iz)) solid var(--ac);box-shadow:0 0 0 calc(2px*var(--iz)) #fff,0 0 calc(14px*var(--iz)) var(--ac);cursor:move}#frame.lock{pointer-events:none}
details{margin:4px 0}summary{min-height:36px;display:flex;align-items:center;font-weight:600}
#handle{position:absolute;right:calc(-15px*var(--iz));bottom:calc(-15px*var(--iz));width:calc(30px*var(--iz));height:calc(30px*var(--iz));border-radius:50%;background:var(--ac);border:calc(3px*var(--iz)) solid #fff;cursor:nwse-resize}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--mu)}
#start button{font-size:18px;padding:16px 28px}
#tools{display:flex;gap:6px;padding:6px 8px}#tools button{flex:1;padding:6px 2px;font-size:13px}
#panel{background:var(--sf);border-top:1px solid var(--bd);padding:8px 10px;max-height:46vh;overflow:auto}
.r{display:flex;gap:6px;margin:4px 0;flex-wrap:wrap;align-items:center}.r>button{flex:1}
.r.seg button{padding:6px 4px}.em{font-size:22px;flex:0 0 auto!important;min-width:44px}
label.s{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);flex:1;min-width:200px}label.s input{flex:1}
small,#msg{color:var(--mu);font-size:12px}#msg{min-height:34px;padding:2px 12px}#msg[data-e="1"]{color:var(--er)}
#modal{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:9;color:#fff;text-align:center}
#modal img{max-width:100%;max-height:60%;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#modal a{color:#fff;text-decoration:underline}
</style></head><body>
<header>🫣 かおかくしカメラ</header>
<div id="stage"><div id="vp" class="off"><div id="layer"><canvas id="cv"></canvas><div id="frame" hidden><div id="handle"></div></div></div></div>
 <div id="start"><button class="p" id="pick">📷 写真を選ぶ</button><span>① 写真を選ぶ → ② 顔を自動で隠す → ③ ずれた所を直す → ④ 保存<br>写真は端末内で処理します。顔検出用ファイルの読み込みには通信が必要な場合があります。</span></div></div>
<div id="tools"><button id="zout" disabled>－ 縮小</button><button id="zin" disabled>＋ 拡大</button><button id="fit" disabled>全体表示</button><button id="rot" disabled>↻ 90°回転</button></div>
<div id="msg"></div>
<div id="panel">
 <div class="r"><button id="pick2">📷 写真を変更</button><button class="p" id="auto" disabled>✨ 顔を自動で隠す</button></div>
 <div class="r"><button id="add" disabled>＋ 顔隠しを追加</button><button id="undo" disabled>↶ 元に戻す</button><button id="redo" disabled>↷ やり直す</button></div>
 <div class="r" id="selbar" hidden><b id="seltxt" style="flex:1 1 100%"></b><label class="s">大きさ<input id="size" type="range" min="3" max="80"></label><button id="del">選択中の顔隠しを削除</button></div>
 <details id="aux"><summary id="sum">隠し方・詳細</summary>
  <small id="klabel"></small>
  <div class="r seg"><button data-k="fill">■ 塗りつぶし</button><button data-k="mosaic">▦ モザイク</button><button data-k="stamp">😊 スタンプ</button></div>
  <div class="r" id="emojis" hidden></div>
  <div class="r" id="coarse" hidden><label class="s">粗さ（右ほど粗い）<input id="cs" type="range" min="4" max="30"></label></div>
  <small id="kn"></small></details>
 <div class="r"><button class="p" id="save" disabled>💾 保存・共有する</button></div>
 <small>保存前に、隠したい顔がすべて隠れているか確認してください（スタンプは透けて顔が見える場合があります）。顔隠しをタップで選択、丸いハンドルで大きさを変更できます。</small>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="modal"><p>画像を長押しして「写真に追加／画像を保存」で保存してください</p><img id="mimg" alt=""><a id="dl" download="kao-camera.jpg">PCの場合はここからダウンロード</a><button id="mclose">閉じる</button></div>
<script type="module" src="app.js"></script></body></html>
