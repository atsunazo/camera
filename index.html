function layoutTemplates(n){const t=[];for(let c=1;c<=4;c++)if(gridAllowed(n,c))t.push({key:'g'+c,hero:false,cols:c,label:c+'列で同じ大きさ'});if(n>=3){t.push({key:'ht',hero:true,heroPos:'top',label:'上に1枚を大きく'});t.push({key:'hl',hero:true,heroPos:'left',label:'左に1枚を大きく'})}return t}
function currentKey(){return S.hero&&S.n>=3?(S.heroPos==='left'?'hl':'ht'):'g'+S.cols}
function normalizeLayout(){if(S.n<3)S.hero=false;if(!S.heroPos)S.heroPos='top';if(!S.hero&&!gridAllowed(S.n,S.cols)){const ok=[1,2,3,4].filter(c=>gridAllowed(S.n,c));S.cols=ok.sort((a,b)=>Math.abs(a-S.cols)-Math.abs(b-S.cols))[0]||1}}
cellBoxes=function(d){normalizeLayout();return layoutBoxes({hero:S.hero,heroPos:S.heroPos,cols:S.cols},d.W,d.H,d.gap,S.n)};
const recommendBefore=recommendLayout;recommendLayout=function(){recommendBefore();normalizeLayout()};
function thumbSVG(L){const r=boardRatio(),T=40,w=r>=1?T:T*r,h=r>=1?T/r:T;return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+layoutBoxes(L,w,h,1.6,S.n).map((b,i)=>'<rect'+(L.hero&&i===0?' class="big"':'')+' x="'+b.x.toFixed(2)+'" y="'+b.y.toFixed(2)+'" width="'+b.w.toFixed(2)+'" height="'+b.h.toFixed(2)+'" rx="1.2"/>').join('')+'</svg>'}
function chooseTemplate(t){S.auto=false;S.hero=t.hero;if(t.hero)S.heroPos=t.heroPos;else S.cols=t.cols;commit()}
function renderLayoutControls(){const strip=$('#layoutStrip');if(!strip)return;const key=currentKey(),auto=S.auto!==false,sig=[S.n,S.shape,key,auto,loading].join('|');document.querySelectorAll('#shapeSeg [data-shape]').forEach(b=>{const on=b.dataset.shape===S.shape;b.classList.toggle('active',on);b.setAttribute('aria-checked',String(on));b.disabled=loading});if(strip.dataset.sig===sig)return;strip.dataset.sig=sig;strip.replaceChildren();const a=document.createElement('button');a.id='autoLayout';a.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>おまかせ';a.title='写真の向きに合わせて自動で並べます';a.setAttribute('role','radio');a.setAttribute('aria-checked',String(auto));a.classList.toggle('active',auto);a.disabled=loading;a.onclick=()=>{S.auto=true;S.hero=false;recommendLayout();commit()};const sep=document.createElement('span');sep.className='stripSep';strip.append(a,sep);for(const t of layoutTemplates(S.n)){const b=document.createElement('button');b.innerHTML=thumbSVG(t);b.title=t.label;b.setAttribute('aria-label',t.label);b.setAttribute('role','radio');const on=!auto&&t.key===key;b.setAttribute('aria-checked',String(on));b.classList.toggle('active',on);if(auto&&t.key===key)b.style.borderStyle='dashed';b.disabled=loading;b.onclick=()=>chooseTemplate(t);strip.append(b)}const act=strip.querySelector('.active:not(#autoLayout)')||[...strip.children].find(el=>el.style.borderStyle==='dashed');if(act)act.scrollIntoView({block:'nearest',inline:'nearest'})}
document.querySelectorAll('#shapeSeg [data-shape]').forEach(b=>b.onclick=()=>{if(S.shape===b.dataset.shape)return;S.shape=b.dataset.shape;if(S.auto!==false)recommendLayout();commit()});
const renderBeforeStrip=render;render=function(){normalizeLayout();renderBeforeStrip();renderLayoutControls()};
render();

// no-dbl-zoom-v1: ホーム画面アプリ（iOSのスタンドアロン表示）でもダブルタップ拡大を止める
(()=>{let last=0,lastX=0,lastY=0;const skip=el=>!!(el&&el.closest&&el.closest('input,textarea,select,[contenteditable="true"]'));
document.addEventListener('touchend',e=>{if(e.touches.length||e.changedTouches.length!==1)return;const t=e.changedTouches[0],now=Date.now(),near=Math.hypot(t.clientX-lastX,t.clientY-lastY)<40;if(now-last<350&&near&&!skip(e.target)&&e.cancelable){e.preventDefault();const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&el.closest&&el.closest('button,a,label,[role="button"],[role="radio"]'))el.click();last=0;return}last=now;lastX=t.clientX;lastY=t.clientY},{passive:false});
document.addEventListener('dblclick',e=>{if(!skip(e.target)&&e.cancelable)e.preventDefault()},{passive:false});
for(const name of ['gesturestart','gesturechange','gestureend'])document.addEventListener(name,e=>{if(e.cancelable)e.preventDefault()},{passive:false})})();

// fit-all-v1: 写真の見せ方（枠いっぱい／全体を表示）を一括で変更
function fitLabel(){const ps=S.slots.filter(Boolean);if(!ps.length)return DEFAULT_FIT==='cover'?'いっぱい':'全体';const a=ps.every(p=>p.fit==='cover'),b=ps.every(p=>p.fit==='contain');return a?'いっぱい':b?'全体':'混在'}
$('#fitAll').onclick=()=>{const cur=fitLabel()==='いっぱい'?'cover':fitLabel()==='全体'?'contain':null;const d=document.createElement('div');d.append(choices([['cover','枠いっぱい（端が少し切れる）'],['contain','全体を表示（すき間ができる）']],cur,v=>{S.slots.forEach(p=>{if(p){p.fit=v;p.zoom=1;p.x=50;p.y=50}});(S.parked||[]).forEach(p=>{if(p)p.fit=v});DEFAULT_FIT=v;try{localStorage.setItem('nazo-collage-fit',v)}catch{}commit();close()}));const n=document.createElement('p');n.className='lmInfo';n.style.marginTop='8px';n.textContent='すべての写真に反映し、拡大・位置の調整はリセットされます。1枚ずつ変えたいときは写真をタップして「写る範囲を調整」から選べます。';d.append(n);sheet('写真の見せ方（すべて）',d)};

// custom-layout-v1: 「中央に大きく」「ずらし」と、自分で作る並べ方（マイ並べ方）
const LM_UNITS=24,LM_KEY='nazo-collage-layouts';
function loadMine(){try{const a=JSON.parse(localStorage.getItem(LM_KEY)||'[]');return Array.isArray(a)?a.filter(t=>t&&Array.isArray(t.rects)&&t.rects.length>=2&&t.rects.length<=9):[]}catch{return[]}}
function saveMine(a){try{localStorage.setItem(LM_KEY,JSON.stringify(a.slice(-20)))}catch{toast('保存できませんでした')}}
function rectsToBoxes(rects,W,H,g){const A={x:g,y:g,w:W-2*g,h:H-2*g};return rects.map(([x,y,w,h])=>{let x0=A.x+x*A.w,x1=A.x+(x+w)*A.w,y0=A.y+y*A.h,y1=A.y+(y+h)*A.h;if(x>0.001)x0+=g/2;if(x+w<0.999)x1-=g/2;if(y>0.001)y0+=g/2;if(y+h<0.999)y1-=g/2;return{x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0)}})}
function centerBoxes(W,H,g,n){const r=n-1,L=Math.ceil(r/2),R=r-L,iw=W-2*g,sides=R?2:1,sw=(iw*.5-g*sides)/sides,cw=iw-sides*(sw+g);const left=equalGrid(g,g,sw,H-2*g,L,L,g,true),hero={x:g+sw+g,y:g,w:cw,h:H-2*g},right=R?equalGrid(g+sw+g+cw+g,g,sw,H-2*g,R,R,g,true):[];return[hero,...left,...right]}
function staggerBoxes(W,H,g,n){const cols=n<=5?2:3,counts=Array.from({length:cols},(_,i)=>Math.floor(n/cols)+(i<n%cols?1:0)),cw=(W-g*(cols+1))/cols,out=[];counts.forEach((k,c)=>{let w=Array(k).fill(1);if(c%2===1&&k>=2){w[0]=.6;w[k-1]=1.4}if(c%2===0&&k>=2&&counts.every(v=>v===k)&&cols===3&&c===2){w[0]=1.3;w[k-1]=.7}const sum=w.reduce((a,b)=>a+b,0),ih=H-g*(k+1);let y=g;w.forEach(v=>{const h=ih*v/sum;out.push({x:g+c*(cw+g),y,w:cw,h});y+=h+g})});return out}
const layoutBoxesBase=layoutBoxes;
layoutBoxes=function(L,W,H,g,n){if(L.tpl==='hc'&&n>=3)return centerBoxes(W,H,g,n);if(L.tpl==='st'&&n>=4)return staggerBoxes(W,H,g,n);if(L.rects&&L.rects.length===n)return rectsToBoxes(L.rects,W,H,g);return layoutBoxesBase(L,W,H,g,n)};
function findMine(id){return loadMine().find(t=>t.id===id)}
function currentL(){const L={hero:S.hero,heroPos:S.heroPos,cols:S.cols,tpl:S.tpl||null};if(S.tpl&&S.tpl.startsWith('m:')){const t=findMine(S.tpl.slice(2));if(t)L.rects=t.rects}return L}
const normalizeBefore=normalizeLayout;normalizeLayout=function(){if(S.tpl){const ok=S.tpl==='hc'?S.n>=3:S.tpl==='st'?S.n>=4:(()=>{const t=findMine(S.tpl.slice(2));return !!t&&t.rects.length===S.n})();if(!ok)S.tpl=null}normalizeBefore()};
cellBoxes=function(d){normalizeLayout();return layoutBoxes(currentL(),d.W,d.H,d.gap,S.n)};
const templatesBefore=layoutTemplates;layoutTemplates=function(n){const t=templatesBefore(n);if(n>=3)t.push({key:'hc',tpl:'hc',hero:true,label:'中央に1枚を大きく'});if(n>=4)t.push({key:'st',tpl:'st',hero:false,label:'ずらして並べる'});loadMine().filter(m=>m.rects.length===n).forEach(m=>t.push({key:'m:'+m.id,tpl:'m:'+m.id,rects:m.rects,mine:true,hero:false,label:'マイ並べ方'}));return t};
currentKey=function(){if(S.tpl)return S.tpl;return S.hero&&S.n>=3?(S.heroPos==='left'?'hl':'ht'):'g'+S.cols};
const chooseBefore=chooseTemplate;chooseTemplate=function(t){if(t.tpl){if(t.mine&&S.tpl===t.tpl&&S.auto===false){mineMenu(t);return}S.auto=false;S.hero=false;S.tpl=t.tpl;commit();return}S.tpl=null;chooseBefore(t)};
const recommendBefore2=recommendLayout;recommendLayout=function(){if(S.auto!==false)S.tpl=null;recommendBefore2()};
function mineMenu(t){const d=document.createElement('div');d.className='sheetActions';[['この並べ方を編集',()=>openMaker(t.tpl.slice(2))],['この並べ方を削除',()=>{if(!confirm('このマイ並べ方を削除しますか？'))return;saveMine(loadMine().filter(m=>'m:'+m.id!==t.tpl));S.tpl=null;commit();close()}]].forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;d.append(b)});sheet('マイ並べ方',d)}
// 並べ方の帯の最後に「自分で作る」を追加
const renderStripBefore=renderLayoutControls;renderLayoutControls=function(){const strip=$('#layoutStrip');const before=strip&&strip.dataset.sig;renderStripBefore();if(!strip)return;strip.querySelectorAll('button').forEach(b=>{const t=layoutTemplates(S.n).find(x=>x.label===b.getAttribute('aria-label')&&x.mine);if(t)b.classList.add('mine')});if(strip.dataset.sig!==before||!strip.querySelector('#makeLayout')){const sep=document.createElement('span');sep.className='stripSep';const mk=document.createElement('button');mk.id='makeLayout';mk.innerHTML='<b>＋</b>自分で作る';mk.title='枠を自由に配置して並べ方を作ります';mk.disabled=loading;mk.onclick=()=>openMaker(null);strip.append(sep,mk)}};
// 同じラベルのマイ並べ方が複数あるとき用に、帯の再描画を keyベースで行う
const thumbBefore=thumbSVG;thumbSVG=function(L){if(L.tpl&&!L.rects&&L.tpl.startsWith('m:')){const m=findMine(L.tpl.slice(2));if(m)L={...L,rects:m.rects}}return thumbBefore(L)};
// 作成画面
function openMaker(editId){const units=LM_UNITS,snap=v=>Math.round(v*units)/units;let rects;const ed=editId?findMine(editId):null;if(ed)rects=ed.rects.map(r=>r.slice());else rects=layoutBoxes(currentL(),1,1,0,S.n).map(b=>[snap(b.x),snap(b.y),Math.max(1/units,snap(b.w)),Math.max(1/units,snap(b.h))]);let sel=-1;const hist=[];
const d=document.createElement('div');const info=document.createElement('p');info.className='lmInfo';info.textContent='何もないところをなぞると枠を追加。枠はドラッグで移動、選んだ枠の右下の●で大きさを変更。番号の順に写真が入ります（2〜9枠）。';const box=document.createElement('div');box.className='lmBox';const r=boardRatio();box.style.aspectRatio=String(r);box.style.width=`min(100%, calc(34dvh * ${r}))`;const g=100/units;box.style.backgroundSize=`${g}% ${g}%`;
const bar=document.createElement('div');bar.className='lmBar';const mk=(t,f,cls)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;if(cls)b.className=cls;bar.append(b);return b};
const bUndo=mk('元に戻す',()=>{if(!hist.length)return;rects=hist.pop();sel=-1;draw()});const bDel=mk('選んだ枠を削除',()=>{if(sel<0)return;push();rects.splice(sel,1);sel=-1;draw()});const bFront=mk('一番前へ',()=>{if(sel<0)return;push();const [x]=rects.splice(sel,1);rects.push(x);sel=rects.length-1;draw()});const sp=document.createElement('span');sp.className='grow';bar.append(sp);const bSave=mk('保存して使う',save,'primary');
d.append(info,box,bar);
function push(){hist.push(rects.map(x=>x.slice()));if(hist.length>30)hist.shift()}
function draw(){box.replaceChildren();rects.forEach((q,i)=>{const el=document.createElement('div');el.className='lmRect'+(i===sel?' sel':'');Object.assign(el.style,{left:q[0]*100+'%',top:q[1]*100+'%',width:q[2]*100+'%',height:q[3]*100+'%',zIndex:String(i+1)});el.dataset.i=i;el.textContent=i+1;const h=document.createElement('span');h.className='lmHandle';el.append(h);box.append(el)});bUndo.disabled=!hist.length;bDel.disabled=sel<0;bFront.disabled=sel<0;bSave.disabled=rects.length<2||rects.length>9;bSave.textContent=rects.length>9?'9枠までです':rects.length<2?'2枠以上必要です':`保存して使う（${rects.length}枚）`}
let drag=null;const pt=e=>{const b=box.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),y:Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))}};
box.addEventListener('pointerdown',e=>{e.preventDefault();box.setPointerCapture(e.pointerId);const p=pt(e),handle=e.target.closest('.lmHandle'),re=e.target.closest('.lmRect');if(re){const i=+re.dataset.i;sel=i;push();drag={mode:handle?'size':'move',i,p0:p,r0:rects[i].slice(),moved:false};draw();return}sel=-1;drag={mode:'new',p0:p,el:null};draw()});
box.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y,m=1/units;if(drag.mode==='move'){const q=drag.r0;rects[drag.i]=[Math.max(0,Math.min(1-q[2],snap(q[0]+dx))),Math.max(0,Math.min(1-q[3],snap(q[1]+dy))),q[2],q[3]];drag.moved=true;draw()}else if(drag.mode==='size'){const q=drag.r0;rects[drag.i]=[q[0],q[1],Math.max(2*m,Math.min(1-q[0],snap(q[2]+dx))),Math.max(2*m,Math.min(1-q[1],snap(q[3]+dy)))];drag.moved=true;draw()}else{const x0=snap(Math.min(drag.p0.x,p.x)),y0=snap(Math.min(drag.p0.y,p.y)),x1=snap(Math.max(drag.p0.x,p.x)),y1=snap(Math.max(drag.p0.y,p.y));drag.r=[x0,y0,x1-x0,y1-y0];if(!drag.el){drag.el=document.createElement('div');drag.el.className='lmDraft';box.append(drag.el)}Object.assign(drag.el.style,{left:x0*100+'%',top:y0*100+'%',width:(x1-x0)*100+'%',height:(y1-y0)*100+'%'})}});
const end=()=>{if(!drag)return;if(drag.mode==='new'){const q=drag.r;if(q&&q[2]>=2/units&&q[3]>=2/units){if(rects.length>=9)toast('枠は9つまでです');else{push();rects.push(q);sel=rects.length-1}}}else if(!drag.moved)hist.pop();drag=null;draw()};box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
function save(){if(rects.length<2||rects.length>9)return;const a=loadMine();let id=editId;if(id){const t=a.find(m=>m.id===id);if(t)t.rects=rects}else{id=Date.now().toString(36);a.push({id,rects})}saveMine(a);S.auto=false;S.hero=false;S.tpl='m:'+id;$('#layoutStrip').dataset.sig='';if(rects.length!==S.n)setCount(rects.length);else commit();close();toast('マイ並べ方に保存しました')}
draw();sheet(editId?'マイ並べ方を編集':'並べ方を自分で作る',d)}
const renderBeforeFit=render;render=function(){renderBeforeFit();const sp=$('#fitAll span');if(sp)sp.textContent=fitLabel()};render();
</script></body></html>
