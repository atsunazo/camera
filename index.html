<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>写真編集</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#594953;background:#fff9fb;--accent:#d96c95}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:100dvh;display:flex;flex-direction:column}button{font:inherit;min-width:42px;min-height:42px;padding:8px 10px;border:1px solid #e7dce1;border-radius:12px;background:white;color:inherit;touch-action:manipulation}button:disabled{opacity:.35}button:focus-visible{outline:3px solid #9772b2;outline-offset:2px}button.active{border:2px solid var(--accent);background:#fff0f6}button.primary{background:var(--accent);color:white;border-color:var(--accent)}.top{display:flex;align-items:center;gap:6px;padding:7px 10px;padding-top:max(7px,env(safe-area-inset-top))}.top svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.top .spacer{flex:1}.top #change{font-size:12px;padding:8px}.top #remove{font-size:20px}main{flex:1;min-height:150px;position:relative;overflow:hidden;background:#eee9ed;border-radius:17px;margin:0 9px}#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}#layer{position:absolute;transform-origin:0 0}canvas{display:block;width:100%;height:100%;pointer-events:none}#objects{position:absolute;inset:0;pointer-events:none}.object{position:absolute;transform-origin:center;pointer-events:auto;border:calc(1px * var(--inv)) solid transparent}.object.selected{border:calc(2px * var(--inv)) solid #d96c95}.object button{position:absolute;min-width:0;min-height:0;width:calc(28px * var(--inv));height:calc(28px * var(--inv));padding:0;border:calc(2px * var(--inv)) solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(20px * var(--inv));line-height:1;box-shadow:0 1px 4px #0002;background:#fff;color:#a5486b}.delete{right:calc(-13px * var(--inv));top:calc(-13px * var(--inv))}.resize{right:calc(-13px * var(--inv));bottom:calc(-13px * var(--inv));background:#e99fba!important;color:#fff!important}.spin{left:calc(-13px * var(--inv));bottom:calc(-13px * var(--inv));font-size:calc(17px * var(--inv))!important}#empty{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}#empty button{padding:15px 24px;font-size:16px}footer{padding:10px 9px max(10px,env(safe-area-inset-bottom));background:#fff}#palette{display:flex;gap:5px;justify-content:center}#palette button{flex:1;max-width:65px;font-size:25px;padding:5px 0}#palette .mosaic{font-size:29px}#swatch{display:block;width:23px;height:23px;border-radius:5px;margin:auto;border:1px solid #0001}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1}.adjust{display:flex;align-items:center;gap:9px;font-size:12px;margin-top:8px}.adjust input{accent-color:var(--accent);flex:1;min-width:50px}#status{font-size:12px;line-height:1.5;color:#98617b;margin-top:7px}dialog{border:0;border-radius:18px;padding:18px;width:460px;max-width:94vw;max-height:90dvh;color:#594953}dialog::backdrop{background:#35212cbd}dialog p{font-size:14px;line-height:1.7}#preview{display:block;max-width:100%;max-height:55dvh;margin:10px auto}dialog a{display:inline-block;padding:12px;color:#a5486b}.close{float:right}@media(max-width:360px){.top{gap:4px;padding-left:7px;padding-right:7px}.top button{min-width:38px;padding:7px}#palette{gap:3px}#palette button{min-width:35px}}
</style><body>
<div class="top"><button id="undo" aria-label="元に戻す" title="元に戻す" disabled><svg viewBox="0 0 24 24"><path d="M9 4 4 9l5 5M4 9h9a7 7 0 0 1 0 14" transform="translate(0 -2)"/></svg></button><button id="redo" aria-label="やり直す" title="やり直す" disabled><svg viewBox="0 0 24 24"><path d="m15 4 5 5-5 5m5-5h-9a7 7 0 0 0 0 14" transform="translate(0 -2)"/></svg></button><button id="rotate" aria-label="写真を90度回転" title="写真を90度回転" disabled><svg viewBox="0 0 24 24"><path d="M20 4v6h-6M20 10a8 8 0 1 0 0 6"/></svg></button><button id="fit" aria-label="選択を解除して全体表示" title="全体表示" disabled><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><span class="spacer"></span><button id="change" disabled>写真を変更</button><button id="remove" aria-label="写真を削除" title="写真を削除" hidden>×</button></div>
<main><div id="vp" hidden><div id="layer"><canvas id="cv"></canvas><div id="objects"></div></div></div><div id="empty"><button class="primary" id="pick">写真を選ぶ</button></div></main>
<footer><div id="palette"></div><div class="adjust" id="roughRow" hidden><label for="rough">粗さ</label><input id="rough" type="range" min="4" max="28" value="22"></div><div class="actions"><button id="auto">自動で追加</button><button class="primary" id="save">保存</button></div><div id="status" role="status" aria-live="polite" hidden></div></footer>
<input id="file" type="file" accept="image/*" hidden><dialog id="confirm"><p>写真と編集内容を削除しますか？<br>この操作は元に戻せません。</p><div class="actions"><button id="cancel">キャンセル</button><button class="primary" id="destroy">削除する</button></div></dialog>
<dialog id="result"><button class="close" id="closeResult" aria-label="閉じる">×</button><p>隠したい顔がすべて隠れているか確認して保存してください。</p><img id="preview" alt="保存する編集済み写真"><a id="download" download="photo.jpg">ダウンロード</a><button id="share" hidden>共有・保存</button></dialog>
<script type="module">
const $=s=>document.querySelector(s),vp=$('#vp'),layer=$('#layer'),cv=$('#cv'),objects=$('#objects');
const EM=['🥰','😊','😽','🐰','🐻'],COLORS=['#f6aac6','#bfa8de','#a8d8cc','#f5d490','#a9cde8','#ffffff'];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rotatePoint=(x,y,a)=>({x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)});
const rotatedBounds=(w,h,a)=>({w:Math.abs(w*Math.cos(a))+Math.abs(h*Math.sin(a)),h:Math.abs(w*Math.sin(a))+Math.abs(h*Math.cos(a))});
let photo=null,masks=[],sel=-1,tool='stamp',emoji=EM[0],random=false,colorIndex=0,rough=10,angle=0,busy=false,seq=0,hist=[],hi=-1,raf=0,resultURL=null,savedFile=null,g=null;
const V={z:1,f:1,x:0,y:0},points=new Map();
function say(t=''){ $('#status').hidden=!t;$('#status').textContent=t }
function snapshot(){return JSON.stringify({masks,angle})}
function commit(){const s=snapshot();if(hist[hi]!==s){hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>70)hist.shift();hi=hist.length-1}ui()}
function ui(){for(const id of ['auto','save','change','rotate','fit'])$('#'+id).disabled=busy||!photo;$('#pick').disabled=busy;$('#remove').hidden=!photo;$('#remove').disabled=busy;$('#empty').hidden=!!photo;vp.hidden=!photo;$('#undo').disabled=busy||hi<=0;$('#redo').disabled=busy||hi>=hist.length-1;$('#roughRow').hidden=tool!=='mosaic';$('#rough').disabled=busy;$('#rough').value=32-rough;document.querySelectorAll('[data-emoji]').forEach(b=>{b.classList.toggle('active',tool==='stamp'&&!random&&b.dataset.emoji===emoji);b.disabled=busy});$('#random').classList.toggle('active',tool==='stamp'&&random);$('#random').disabled=busy;$('#mosaic').classList.toggle('active',tool==='mosaic');$('#color').classList.toggle('active',tool==='fill');$('#swatch').style.background=COLORS[colorIndex];$('#mosaic').disabled=$('#color').disabled=busy;frames()}
function bounds(){const b=rotatedBounds(photo.width,photo.height,angle),w=b.w*V.f*V.z,h=b.h*V.f*V.z;V.x=w<=vp.clientWidth?0:clamp(V.x,-(w-vp.clientWidth)/2,(w-vp.clientWidth)/2);V.y=h<=vp.clientHeight?0:clamp(V.y,-(h-vp.clientHeight)/2,(h-vp.clientHeight)/2)}
function view(){if(!photo)return;bounds();const k=V.f*V.z;layer.style.width=photo.width+'px';layer.style.height=photo.height+'px';layer.style.transform=`translate(${vp.clientWidth/2+V.x}px,${vp.clientHeight/2+V.y}px) rotate(${angle}rad) scale(${k}) translate(-50%,-50%)`;layer.style.setProperty('--inv',1/k);frames()}
function fit(){if(!photo)return;const b=rotatedBounds(photo.width,photo.height,angle);V.f=Math.min(vp.clientWidth/b.w,vp.clientHeight/b.h)*.88;V.z=1;V.x=V.y=0;view()}
function local(e){const r=vp.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function toImage(p){const q=rotatePoint(p.x-vp.clientWidth/2-V.x,p.y-vp.clientHeight/2-V.y,-angle),k=V.f*V.z;return{x:q.x/k+photo.width/2,y:q.y/k+photo.height/2}}
function inside(p){return p.x>=0&&p.y>=0&&p.x<=photo.width&&p.y<=photo.height}
function maskLocal(m,p){return rotatePoint(p.x-m.x,p.y-m.y,-m.rot)}
function choose(i){sel=i;if(i>=0){const m=masks[i];tool=m.kind;emoji=m.emoji;rough=m.n;const c=COLORS.indexOf(m.color);if(c>=0)colorIndex=c}ui()}
function makeMask(x,y,w,h){return {x,y,w,h,rot:0,kind:tool,emoji:random?EM[Math.floor(Math.random()*EM.length)]:emoji,color:COLORS[colorIndex],n:rough}}
function frames(){if(!photo){objects.innerHTML='';return}while(objects.children.length>masks.length)objects.lastChild.remove();masks.forEach((m,i)=>{let el=objects.children[i];if(!el){el=document.createElement('div');el.className='object';el.innerHTML='<button class="delete" aria-label="このスタンプ・範囲を削除">×</button><button class="resize" aria-label="大きさを変更">↘</button><button class="spin" aria-label="回転">↻</button>';objects.append(el)}el.dataset.index=i;el.classList.toggle('selected',i===sel);el.querySelector('.resize').hidden=i!==sel;el.querySelector('.spin').hidden=i!==sel;el.querySelectorAll('button').forEach(b=>b.disabled=busy);Object.assign(el.style,{left:m.x-m.w/2+'px',top:m.y-m.h/2+'px',width:m.w+'px',height:m.h+'px',transform:`rotate(${m.rot}rad)`})})}
function render(target,s){target.width=Math.max(1,Math.round(photo.width*s));target.height=Math.max(1,Math.round(photo.height*s));const c=target.getContext('2d');c.drawImage(photo,0,0,target.width,target.height);const temp=document.createElement('canvas');for(const m of masks){c.save();c.scale(s,s);c.translate(m.x,m.y);c.rotate(m.rot);if(m.kind==='stamp'){c.font=`${Math.max(m.w,m.h)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(m.emoji,0,m.h*.06)}else if(m.kind==='fill'){c.fillStyle=m.color;c.fillRect(-m.w/2,-m.h/2,m.w,m.h)}else{c.beginPath();c.rect(-m.w/2,-m.h/2,m.w,m.h);c.clip();temp.width=Math.max(1,Math.round(m.n*m.w/Math.min(m.w,m.h)));temp.height=Math.max(1,Math.round(m.n*m.h/Math.min(m.w,m.h)));const t=temp.getContext('2d');t.setTransform(temp.width/m.w,0,0,temp.height/m.h,temp.width/2,temp.height/2);t.rotate(-m.rot);t.drawImage(photo,-m.x,-m.y);c.imageSmoothingEnabled=false;c.drawImage(temp,-m.w/2,-m.h/2,m.w,m.h)}c.restore()}}
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(photo)render(cv,Math.min(1,1800/Math.max(photo.width,photo.height)));frames()})}
$('#palette').innerHTML=EM.map(e=>`<button data-emoji="${e}" aria-label="${e}を選ぶ">${e}</button>`).join('')+'<button id="random" aria-label="ランダムスタンプ" title="5種類からランダム">⤨</button><button class="mosaic" id="mosaic" aria-label="範囲モザイク" title="範囲モザイク">▦</button><button id="color" aria-label="カラー。連続して押すと色を変更" title="カラー／もう一度押して色を変更"><span id="swatch"></span></button>';
function applyTool(){if(sel>=0){const m=masks[sel];m.kind=tool;m.emoji=emoji;m.color=COLORS[colorIndex];m.n=rough;commit();schedule()}ui();say()}
document.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{tool='stamp';random=false;emoji=b.dataset.emoji;applyTool()});$('#random').onclick=()=>{tool='stamp';random=true;if(sel>=0)emoji=EM[Math.floor(Math.random()*EM.length)];applyTool()};$('#mosaic').onclick=()=>{tool='mosaic';applyTool()};$('#color').onclick=()=>{if(tool==='fill')colorIndex=(colorIndex+1)%COLORS.length;tool='fill';applyTool()};
$('#rough').oninput=e=>{rough=32-Number(e.target.value);if(sel>=0){masks[sel].n=rough;schedule()}};$('#rough').onchange=()=>{if(photo)commit()};
objects.addEventListener('click',e=>{if(busy)return;const el=e.target.closest('.object');if(!el)return;const i=Number(el.dataset.index);if(e.target.closest('.delete')){masks.splice(i,1);sel=-1;commit();schedule();say()}});
const distance=(a,b)=>Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),arg=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
vp.onpointerdown=e=>{if(!photo||busy||e.button>0||e.target.closest('.delete'))return;e.preventDefault();vp.setPointerCapture(e.pointerId);const p=local(e);points.set(e.pointerId,p);if(points.size===2){if(g?.type==='place'){masks.splice(g.index,1);sel=-1;schedule()}else if(g?.changed)commit();const[a,b]=[...points.values()],m=masks[sel];g=m?{type:'maskPinch',d:distance(a,b),a:arg(a,b),w:m.w,h:m.h,r:m.rot}:{type:'photoPinch',d:distance(a,b),a:arg(a,b),z:V.z,r:angle,x:V.x,y:V.y,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};ui();return}if(points.size>2)return;const q=toImage(p),el=e.target.closest('.object');if(el){choose(Number(el.dataset.index));const m=masks[sel];if(e.target.closest('.resize'))g={type:'resize',changed:false};else if(e.target.closest('.spin'))g={type:'spin',start:Math.atan2(q.y-m.y,q.x-m.x),r:m.rot,changed:false};else g={type:'drag',dx:m.x-q.x,dy:m.y-q.y,changed:false};return}if(!inside(q)){sel=-1;ui();g={type:'pan',p,x:V.x,y:V.y};return}const s=Math.min(photo.width,photo.height)*.22;masks.push(makeMask(q.x,q.y,s,s));sel=masks.length-1;g={type:'place',index:sel,start:q,p,moved:false};schedule();ui()};
vp.onpointermove=e=>{if(!points.has(e.pointerId)||!g)return;const p=local(e);points.set(e.pointerId,p);const m=masks[sel];if(g.type==='maskPinch'||g.type==='photoPinch'){if(points.size<2)return;const[a,b]=[...points.values()],ratio=distance(a,b)/g.d,delta=arg(a,b)-g.a;if(g.type==='maskPinch'&&m){m.w=clamp(g.w*ratio,12,photo.width*2);m.h=clamp(g.h*ratio,12,photo.height*2);m.rot=g.r+delta;schedule();frames()}else{V.z=clamp(g.z*ratio,1,8);angle=g.r+delta;const q=rotatePoint(g.mx-vp.clientWidth/2-g.x,g.my-vp.clientHeight/2-g.y,delta),k=V.z/g.z;V.x=(a.x+b.x)/2-vp.clientWidth/2-q.x*k;V.y=(a.y+b.y)/2-vp.clientHeight/2-q.y*k;view()}g.changed=true;return}if(g.type==='pan'){V.x=g.x+p.x-g.p.x;V.y=g.y+p.y-g.p.y;view();return}if(!m)return;const q=toImage(p);if(g.type==='place'){if(Math.hypot(p.x-g.p.x,p.y-g.p.y)>6)g.moved=true;if(g.moved&&m.kind!=='stamp'){const x=clamp(q.x,0,photo.width),y=clamp(q.y,0,photo.height);m.x=(g.start.x+x)/2;m.y=(g.start.y+y)/2;m.w=Math.max(12,Math.abs(x-g.start.x));m.h=Math.max(12,Math.abs(y-g.start.y))}else if(g.moved){m.x=clamp(q.x,0,photo.width);m.y=clamp(q.y,0,photo.height)}}else if(g.type==='drag'){m.x=clamp(q.x+g.dx,0,photo.width);m.y=clamp(q.y+g.dy,0,photo.height);g.changed=true}else if(g.type==='resize'){const l=maskLocal(m,q);m.w=clamp(Math.abs(l.x)*2,12,photo.width*2);m.h=clamp(Math.abs(l.y)*2,12,photo.height*2);if(m.kind==='stamp')m.w=m.h=Math.max(m.w,m.h);g.changed=true}else if(g.type==='spin'){m.rot=g.r+Math.atan2(q.y-m.y,q.x-m.x)-g.start;g.changed=true}schedule();frames()};
function end(e){if(!points.has(e.pointerId))return;points.delete(e.pointerId);if(g?.type==='place'){if(e.type!=='pointerup'){masks.splice(g.index,1);sel=-1;schedule();ui()}else commit()}else if(g?.changed)commit();if(points.size){const p=[...points.values()][0];g={type:'pan',p,x:V.x,y:V.y}}else g=null}
for(const event of ['pointerup','pointercancel','lostpointercapture'])vp.addEventListener(event,end);
vp.addEventListener('wheel',e=>{if(!photo||busy)return;e.preventDefault();const p=local(e),z=clamp(V.z*Math.exp(-e.deltaY*.002),1,8),k=z/V.z;V.x=p.x-vp.clientWidth/2-(p.x-vp.clientWidth/2-V.x)*k;V.y=p.y-vp.clientHeight/2-(p.y-vp.clientHeight/2-V.y)*k;V.z=z;view()},{passive:false});
$('#pick').onclick=$('#change').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const id=++seq;busy=true;ui();say('読み込み中…');let u;try{u=URL.createObjectURL(f);const im=new Image();im.src=u;await im.decode();if(id!==seq)return;const s=Math.min(1,3000/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c;masks=[];sel=-1;angle=0;hist=[];hi=-1;points.clear();g=null;ui();fit();schedule();commit();say()}catch(e){say('写真を開けませんでした。別の画像をお試しください。')}finally{if(u)URL.revokeObjectURL(u);if(id===seq){busy=false;ui()}}};
function restore(i){hi=i;const s=JSON.parse(hist[i]);masks=s.masks;angle=s.angle;sel=-1;fit();schedule();ui();say()}
$('#undo').onclick=()=>{if(hi>0)restore(hi-1)};$('#redo').onclick=()=>{if(hi<hist.length-1)restore(hi+1)};$('#rotate').onclick=()=>{angle+=Math.PI/2;fit();commit()};$('#fit').onclick=()=>{sel=-1;fit();ui();say()};
$('#remove').onclick=()=>$('#confirm').showModal();$('#cancel').onclick=()=>$('#confirm').close();$('#destroy').onclick=()=>{++seq;photo=null;masks=[];sel=-1;angle=0;hist=[];hi=-1;points.clear();g=null;cv.width=cv.height=1;if(resultURL)URL.revokeObjectURL(resultURL);resultURL=null;savedFile=null;$('#preview').removeAttribute('src');$('#download').removeAttribute('href');$('#confirm').close();ui();say()};
let detector=null,loading=null;async function loadDetector(){if(detector)return detector;if(loading)return loading;loading=(async()=>{const root='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',m=await import(root+'/vision_bundle.mjs'),fs=await m.FilesetResolver.forVisionTasks(root+'/wasm');detector=await m.FaceDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},runningMode:'IMAGE',minDetectionConfidence:.5});return detector})().finally(()=>loading=null);return loading}
const tick=()=>new Promise(r=>setTimeout(r,0));
$('#auto').onclick=async()=>{if(busy||!photo)return;busy=true;sel=-1;ui();say('顔検出の準備中…');const id=seq;try{const d=await loadDetector(),W=photo.width,H=photo.height,rs=[{x:0,y:0,w:W,h:H}];if(Math.max(W,H)>1000)for(let j=0;j<2;j++)for(let i=0;i<2;i++)rs.push({x:W*.4*i,y:H*.4*j,w:W*.6,h:H*.6});const bs=[];for(let i=0;i<rs.length;i++){if(id!==seq)return;say(`顔を検出中… ${i+1}/${rs.length}`);await tick();const r=rs[i],c=document.createElement('canvas'),s=Math.min(1,1400/Math.max(r.w,r.h));c.width=Math.round(r.w*s);c.height=Math.round(r.h*s);c.getContext('2d').drawImage(photo,r.x,r.y,r.w,r.h,0,0,c.width,c.height);for(const f of d.detect(c).detections){const b=f.boundingBox;bs.push({x:r.x+(b.originX+b.width/2)*r.w/c.width,y:r.y+(b.originY+b.height/2)*r.h/c.height,w:b.width*r.w/c.width*1.6,h:b.height*r.h/c.height*1.75,score:f.categories[0].score})}}bs.sort((a,b)=>b.score-a.score);let n=0;for(const b of bs){if(masks.some(m=>Math.hypot(m.x-b.x,m.y-b.y)<Math.min(m.w,m.h,b.w,b.h)*.4))continue;masks.push(makeMask(b.x,b.y,b.w,b.h));n++}commit();schedule();say(n?`${n}か所に追加しました。隠し漏れがないか確認してください。`:bs.length?'検出した顔にはすでに追加されています。':'顔が見つかりませんでした。写真をタップして追加できます。')}catch(e){console.error(e);say('自動検出に失敗しました。通信を確認して再試行するか、写真をタップして追加してください。')}finally{if(id===seq){busy=false;ui()}}};
$('#save').onclick=async()=>{if(busy||!photo)return;busy=true;ui();say('保存画像を作成中…');try{const src=document.createElement('canvas');render(src,1);const b=rotatedBounds(photo.width,photo.height,angle),s=Math.min(1,3000/Math.max(b.w,b.h)),c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(b.w*s-1e-7));c.height=Math.max(1,Math.ceil(b.h*s-1e-7));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.rotate(angle);x.scale(s,s);x.drawImage(src,-photo.width/2,-photo.height/2);const blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('encode')),'image/jpeg',.94));if(resultURL)URL.revokeObjectURL(resultURL);resultURL=URL.createObjectURL(blob);savedFile=new File([blob],'photo.jpg',{type:'image/jpeg'});$('#preview').src=resultURL;$('#download').href=resultURL;$('#share').hidden=!(navigator.canShare&&navigator.canShare({files:[savedFile]}));$('#result').showModal();say()}catch(e){say('保存画像を作れませんでした。もう一度お試しください。')}finally{busy=false;ui()}};
$('#closeResult').onclick=()=>$('#result').close();$('#share').onclick=async()=>{try{await navigator.share({files:[savedFile]})}catch(e){if(e.name!=='AbortError')say('共有できませんでした。ダウンロードか画像の長押しで保存してください。')}};
new ResizeObserver(()=>{if(photo)fit()}).observe(vp);ui();
</script></body></html>
