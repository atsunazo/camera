</style><body><div class="top" id="mainTop"><button id="undo" aria-label="元に戻す" title="元に戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5m-5-5h9a6 6 0 0 1 0 12" transform="translate(0 -1)"/></svg></button><button id="redo" aria-label="やり直す" title="やり直す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5h-9a6 6 0 0 0 0 12" transform="translate(0 -1)"/></svg></button><button id="crop" aria-label="トリミング・サイズ・角度" title="トリミング"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v15h15M3 6h15v15M6 6l12 12"/></svg></button><button id="fit" aria-label="全体表示" title="全体表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><span class="spacer"></span><button id="change">写真を変更</button><button id="remove" aria-label="写真を削除" hidden>×</button></div><main><div id="vp" hidden><div id="layer"><canvas id="cv"></canvas><div id="objects"></div></div></div><div id="empty"><button class="primary" id="pick">写真を選ぶ</button></div></main><footer><div id="palette"></div><div class="adjust" id="roughRow" hidden><label for="rough">粗さ</label><input id="rough" type="range" min="4" max="28" value="22"></div><div class="actions"><div class="autoGroup"><button id="auto">自動で追加</button><label class="detectSensitivityLabel" for="detectSensitivity"><span>感度 → 多め</span><input id="detectSensitivity" type="range" min="0" max="100" step="1" value="67" aria-label="顔の検出感度。右ほど候補を多く検出" title="右へ動かすほど多めに検出。次の自動追加で反映"></label></div><button id="save" class="primary">保存</button></div><div id="status" role="status" aria-live="polite" hidden></div></footer><input id="file" type="file" accept="image/*" hidden>

ary id="lockHint">操作方法</summary><p>枠の内側で移動。四隅と上下左右の丸でサイズ変更。鍵で元サイズ固定。角度や比率を決めてから出力サイズを指定してください。通常画面の表示ズームは保存範囲に影響しません。</p></details><div id="cropError" role="alert" hidden></div></div></section>
<dialog id="confirm"><p>写真と編集内容を削除しますか？<br>この操作は元に戻せません。</p><div class="actions"><button id="cancelRemove">キャンセル</button><button id="destroy" class="primary">削除する</button></div></dialog><dialog id="result"><button class="close" id="closeResult" aria-label="閉じる">×</button><p>隠したい顔がすべて隠れているか確認して保存してください。</p><img id="preview" alt="保存する写真"><a id="download" download="photo.jpg">ダウンロード</a><button id="share" hidden>共有・保存</button></dialog><script type="module">const $=s=>document.querySelector(s),vp=$('#vp'),layer=$('#layer'),objects=$('#objects'),cv=$('#cv');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rotatePoint=(x,y,a)=>({x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)});

function cropMask(m,W,H,a,B,R,k){const q=rotatePoint(m.x-W/2,m.y-H/2,a);return{...m,x:(q.x+B.w/2-R.x)*k,y:(q.y+B.h/2-R.y)*k,w:m.w*k,h:m.h*k,rot:m.rot+a}}

const ICON={"left": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 4v6h6M4 10a8 8 0 1 1 0 6\"/></svg>", "right": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 4v6h-6M20 10a8 8 0 1 0 0 6\"/></svg>", "undo": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 5-5 5 5 5m-5-5h9a6 6 0 0 1 0 12\" transform=\"translate(0 -1)\"/></svg>", "redo": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m15 5 5 5-5 5m5-5h-9a6 6 0 0 0 0 12\" transform=\"translate(0 -1)\"/></svg>", "crop": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 3v15h15M3 6h15v15M6 6l12 12\"/></svg>", "fit": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5\"/></svg>", "locked": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"3\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3M12 14v3\"/></svg>", "unlocked": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"3\"/><path d=\"M8 10V7a4 4 0 0 1 8-1M12 14v3\"/></svg>"};

const EM=['🥰','😊','😽','🐰','🐻'],COLORS=['#f6aac6','#bfa8de','#a8d8cc','#f5d490','#a9cde8','#ffffff'];
let photo=null,masks=[],sel=-1,tool='none',emoji=EM[0],random=false,colorIndex=0,rough=10,busy=false,seq=0,hist=[],hi=-1,raf=0,g=null,resultURL=null,savedFile=null,cropState=null,cg=null,initialW=0,initialH=0;

function view(){if(!photo)return;bounds();const k=V.f*V.z;layer.style.width=photo.width+'px';layer.style.height=photo.height+'px';layer.style.transform=`translate(${vp.clientWidth/2+V.x}px,${vp.clientHeight/2+V.y}px) scale(${k}) translate(-50%,-50%)`;layer.style.setProperty('--inv',1/k);frames()}

function syncOutput(from){const c=cropState;if(c.locked){cropSizeNatural();return}const ratio=c.R.w/c.R.h;let w=Number($('#outW').value),h=Number($('#outH').value);if(from==='w'){w=clamp(Math.round(w||1),1,4096);h=Math.max(1,Math.round(w/ratio))}else{h=clamp(Math.round(h||1),1,4096);w=Math.max(1,Math.round(h*ratio))}if(Math.max(w,h)>4096){const k=4096/Math.max(w,h);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k))}$('#outW').value=w;$('#outH').value=h}
$('#outW').onchange=()=>syncOutput('w');$('#outH').onchange=()=>syncOutput('h');
$('#cropStage').onpointerdown=e=>{if(!cropState||cg||e.target.closest('#lock'))return;e.preventDefault();const c=cropState,p=local(e,$('#cropStage')),q={x:(p.x-c.ox)/c.f,y:(p.y-c.oy)/c.f},r=c.R,handle=e.target.closest('[data-dir]');$('#cropStage').setPointerCapture(e.pointerId);const inside=q.x>=r.x&&q.y>=r.y&&q.x<=r.x+r.w&&q.y<=r.y+r.h;cg={id:e.pointerId,mode:handle?'resize':inside?'move':'new',dir:handle?.dataset.dir,q,R:{...r}}};
$('#cropStage').onpointermove=e=>{if(!cg||e.pointerId!==cg.id)return;const c=cropState,p=local(e,$('#cropStage')),q={x:clamp((p.x-c.ox)/c.f,0,c.B.w),y:clamp((p.y-c.oy)/c.f,0,c.B.h)},r=cg.R,ratio=effectiveRatio();if(cg.mode==='move'){c.R.x=clamp(r.x+q.x-cg.q.x,0,c.B.w-r.w);c.R.y=clamp(r.y+q.y-cg.q.y,0,c.B.h-r.h)}else if(cg.mode==='resize')c.R=resizeCrop(r,q.x-cg.q.x,q.y-cg.q.y,cg.dir,c.B,ratio);else{const ax=clamp(cg.q.x,0,c.B.w),ay=clamp(cg.q.y,0,c.B.h),E=q.x>=ax,S=q.y>=ay,dir=(S?'s':'n')+(E?'e':'w');c.R=resizeCrop({x:E?ax:ax-.01,y:S?ay:ay-.01,w:.01,h:.01},q.x-ax,q.y-ay,dir,c.B,ratio)}cropFrame();cropSizeNatural()};for(const name of ['pointerup','pointercancel','lostpointercapture'])$('#cropStage').addEventListener(name,e=>{if(cg?.id===e.pointerId)cg=null});
$('#applyCrop').onclick=()=>{const c=cropState;if(!c)return;try{syncOutput('w');const W=Number($('#outW').value),H=Number($('#outH').value);if(W*H>24000000||Math.max(W,H)>8192)throw Error('large');const k=W/c.R.w,target=document.createElement('canvas');target.width=W;target.height=H;const x=target.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.scale(k,k);x.translate(c.B.w/2-c.R.x,c.B.h/2-c.R.y);x.rotate(c.a);x.drawImage(photo,-photo.width/2,-photo.height/2);masks=masks.map(m=>cropMask(m,photo.width,photo.height,c.a,c.B,c.R,k));photo=target;sel=-1;closeCrop();fit();commit();schedule();say()}catch(e){$('#cropError').hidden=false;$('#cropError').textContent='適用できませんでした。2400万画素・長辺8192pxまでです。固定を解除してサイズを小さくしてください。'}};
$('#save').onclick=async()=>{if(busy||!photo)return;busy=true;ui();say('保存画像を作成中…');try{const c=document.createElement('canvas');render(c,1);const x=c.getContext('2d');x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);const blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('encode')),'image/jpeg',.94));if(resultURL)URL.revokeObjectURL(resultURL);resultURL=URL.createObjectURL(blob);savedFile=new File([blob],'photo.jpg',{type:'image/jpeg'});$('#preview').src=resultURL;$('#download').href=resultURL;$('#share').hidden=!(navigator.canShare&&navigator.canShare({files:[savedFile]}));$('#result').showModal();say()}catch(e){say('保存画像を作れませんでした。もう一度お試しください。')}finally{busy=false;ui()}};$('#closeResult').onclick=()=>$('#result').close();$('#share').onclick=async()=>{try{await navigator.share({files:[savedFile]})}catch(e){if(e.name!=='AbortError')say('共有できませんでした。ダウンロードか画像の長押しで保存してください。')}};
new ResizeObserver(()=>{if(photo)fit()}).observe(vp);new ResizeObserver(()=>{if(cropState)cropLayout()}).observe($('#cropStage'));ui();

// crop-history-bottom-toolbar-v1
function preserveCropOnRotate(R,oldB,newB){const scale=Math.min(1,newB.w/R.w,newB.h/R.h),w=R.w*scale,h=R.h*scale,cx=R.x+R.w/2-oldB.w/2+newB.w/2,cy=R.y+R.h/2-oldB.h/2+newB.h/2;return{x:clamp(cx-w/2,0,newB.w-w),y:clamp(cy-h/2,0,newB.h-h),w,h}}
let cropEdits=[],cropEditIndex=-1;
function cropCapture(){if(!cropState)return null;const c=cropState;return JSON.stringify({a:c.a,ratio:c.ratio,locked:c.locked,portrait:c.portrait,B:c.B,R:c.R,angle:$('#cropAngle').value,outW:$('#outW').value,outH:$('#outH').value})}
function cropHistoryUI(){$('#cropUndo').disabled=!cropState||cropEditIndex<=0;$('#cropRedo').disabled=!cropState||cropEditIndex>=cropEdits.length-1}
function cropRecord(){const s=cropCapture();if(!s)return;if(cropEdits[cropEditIndex]!==s){cropEdits=cropEdits.slice(0,cropEditIndex+1);cropEdits.push(s);if(cropEdits.length>60)cropEdits.shift();cropEditIndex=cropEdits.length-1}cropHistoryUI()}
function cropRestore(index){if(!cropState||index<0||index>=cropEdits.length)return;cg=null;cropEditIndex=index;const s=JSON.parse(cropEdits[index]);Object.assign(cropState,{a:s.a,ratio:s.ratio,locked:s.locked,portrait:s.portrait,B:s.B,R:s.R});$('#cropAngle').value=s.angle;cropUI();$('#outW').value=s.outW;$('#outH').value=s.outH;cropDraw();$('#cropError').hidden=true;cropHistoryUI()}
$('#cropUndo').onclick=()=>cropRestore(cropEditIndex-1);$('#cropRedo').onclick=()=>cropRestore(cropEditIndex+1);
const openCropBefore=$('#crop').onclick;$('#crop').onclick=e=>{openCropBefore(e);if(cropState){cropEdits=[];cropEditIndex=-1;cropRecord()}};
const cropPointerDownBefore=$('#cropStage').onpointerdown;$('#cropStage').onpointerdown=e=>{if(!e.target.closest('#cropBox'))return;cropPointerDownBefore(e)};
for(const event of ['pointerup','pointercancel','lostpointercapture'])$('#cropStage').addEventListener(event,()=>{if(cropState)cropRecord()});
for(const id of ['lock','portrait','landscape','ratios']){const element=$('#'+id),before=element.onclick;element.onclick=e=>{before(e);cropRecord()}}
for(const id of ['outW','outH']){const element=$('#'+id),before=element.onchange;element.onchange=e=>{before(e);cropRecord()}}
function cropRotatePreservingFrame(){if(!cropState)return;const c=cropState,a=Number($('#cropAngle').value)*Math.PI/180,B=rotatedBounds(photo.width,photo.height,a);c.R=preserveCropOnRotate(c.R,c.B,B);c.a=a;c.B=B;cropDraw()}
$('#cropAngle').oninput=cropRotatePreservingFrame;$('#cropAngle').onchange=cropRecord;
function rotateCropStep(direction){if(!cropState)return;let a=Number($('#cropAngle').value)+direction*90;while(a>180)a-=360;while(a< -180)a+=360;$('#cropAngle').value=a;cropRotatePreservingFrame();cropRecord()}
$('#clockwise').onclick=()=>rotateCropStep(1);$('#counterclockwise').onclick=()=>rotateCropStep(-1);
$('#cropScreen').addEventListener('keydown',e=>{if(!cropState||!(e.ctrlKey||e.metaKey)||e.target.closest('input'))return;const key=e.key.toLowerCase();if(key==='z'){e.preventDefault();cropRestore(cropEditIndex+(e.shiftKey?1:-1))}else if(key==='y'){e.preventDefault();cropRestore(cropEditIndex+1)}});
const toolbar=document.querySelector('#mainTop'),footer=document.querySelector('footer');toolbar.classList.add('bottomCommands');footer.prepend(toolbar);cropHistoryUI();
</script></body></html>
